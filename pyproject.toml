[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "katalog-pdf"
version = "0.3.1"
description = "Katalogkan, cari (full-text), temukan duplikat (identik & mirip), dan dapatkan saran rename otomatis (DOI/ISBN) di koleksi file PDF -- lewat CLI atau UI Streamlit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Fatahillah", email = "fatahillah.mubarak@gmail.com" },
]
keywords = ["pdf", "catalog", "katalog", "full-text-search", "duplicate-finder", "near-duplicate", "rename", "doi", "isbn", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=4.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "streamlit>=1.30",
    "tqdm>=4.65",
    "tabulate>=0.9",   # dipakai buat export format Markdown table
    "odfpy>=1.4",      # dipakai buat export format ODS (OpenDocument / LibreOffice)
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.16"]
build = ["pyinstaller>=6.0"]

[project.scripts]
katalog-pdf = "katalog_pdf.cli:main"

[project.urls]
Homepage = "https://github.com/fatahillahmubarak/pdf-file-organizer"
Issues = "https://github.com/fatahillahmubarak/pdf-file-organizer/issues"

[tool.setuptools.packages.find]
include = ["katalog_pdf*"]
